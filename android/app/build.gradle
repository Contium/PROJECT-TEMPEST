plugins {
    id 'com.android.application'
}

// The app's version follows TEMPEST's (package.json), e.g. 1.1.0-alpha.
def tempestVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = 'app.tempest.companion'
    compileSdk = 37

    defaultConfig {
        applicationId = 'app.tempest.companion'
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = tempestVersion
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's code scanner: scans the QR code on the GM's screen without asking for the camera
    // permission (the scanner runs in Google Play services; on devices without them, paste the link).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
